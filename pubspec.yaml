name: mylifepair_matrimony
description: MyLifePair Matrimony - A professional matrimony service application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView
  flutter_inappwebview: ^6.0.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Permissions
  permission_handler: ^11.3.1

  # URL Launcher
  url_launcher: ^6.2.5

  # Toast
  fluttertoast: ^8.2.4

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  # Share
  share_plus: ^9.0.0

  # Package Info
  package_info_plus: ^8.0.0

  # Device Info
  device_info_plus: ^10.1.0

  # Shared Preferences
  shared_preferences: ^2.2.2

  # Path Provider
  path_provider: ^2.1.2

  # HTTP
  http: ^1.2.0

  # Cupertino Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

